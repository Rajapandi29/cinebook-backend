
name: Build and Deploy CineBook Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  AZURE_FUNCTIONAPP_NAME: 'cinebook-api'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test --if-present

      - name: Install Production Dependencies Only
        run: npm prune --omit=dev

      - name: Verify Azure Functions Files
        run: |
          test -f host.json
          test -f package.json

      - name: Create Deployment ZIP
        run: |
          zip -r release.zip . \
            -x ".git/*" \
               ".github/*" \
               "local.settings.json" \
               "release.zip"

      - name: Upload Deployment Package
        uses: actions/upload-artifact@v4
        with:
          name: cinebook-backend
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Download Deployment Package
        uses: actions/download-artifact@v4
        with:
          name: cinebook-backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3E36C054A3324A798BC9E93A16C58A9E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FC06FE53DC9F42AC9100381A6A752507 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C8A7E9A48C9B45A38112B681E7B0C745 }}

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: release.zip
